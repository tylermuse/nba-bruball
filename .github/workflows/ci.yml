name: CI

# Build, typecheck, and test on every push to main and every PR into it.
# Deploys are handled separately by Vercel's Git integration; this workflow is
# the quality gate that tells you whether a commit is green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Tests
        run: npm test
